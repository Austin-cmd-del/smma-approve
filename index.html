<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Approve - SMMA</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: #ffffff; color: #111111; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .card { background: #ffffff; border: 1px solid #e6e6e6; border-radius: 16px; max-width: 520px; width: 100%; padding: 30px 26px 32px; box-shadow: 0 10px 34px rgba(0,0,0,.08); }
  .logo { display: block; width: 210px; max-width: 70%; margin: 2px auto 10px; }
  h1 { font-size: 24px; line-height: 1.3; text-align: center; margin: 10px 0 6px; font-weight: 800; }
  .sub { text-align: center; color: #555f6e; font-size: 15px; line-height: 1.5; }
  .item { background: #f7f7f7; border: 1px solid #e6e6e6; border-radius: 12px; padding: 18px; margin: 22px 0 6px; }
  .item .label { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: #8a93a3; margin-bottom: 6px; font-weight: 700; }
  .item .title { font-size: 18px; font-weight: 800; line-height: 1.4; }
  .item ul { margin: 10px 0 0 18px; color: #333c49; font-size: 14px; line-height: 1.6; }
  button { display: block; width: 100%; margin-top: 24px; padding: 18px 16px; font-size: 18px; font-weight: 800; color: #ffffff; background: #111111; border: none; border-radius: 12px; cursor: pointer; }
  button:active { transform: scale(.99); }
  button:disabled { background: #9aa3b2; color: #ffffff; cursor: default; }
  .fineprint { text-align: center; color: #8a93a3; font-size: 12.5px; margin-top: 14px; line-height: 1.5; }
  .flamebar { height: 5px; border-radius: 99px; background: linear-gradient(90deg, #ff512f, #ff8a00, #ffd23f); margin-top: 22px; }
  .done { text-align: center; padding: 12px 0 4px; }
  .done .check { font-size: 46px; }
  .done h2 { font-size: 22px; margin: 10px 0 6px; font-weight: 800; }
  .done p { color: #555f6e; font-size: 15px; line-height: 1.5; }
  .hidden { display: none; }
</style>
</head>
<body>
  <div class="card">
    <div id="main">
      <img class="logo" src="logo.jpg" alt="SMMA">
      <h1 id="headline">Hi there,</h1>
      <p class="sub">Austin has something ready for your approval.</p>
      <div class="item">
        <div class="label">For</div>
        <div class="title" id="business">Your business</div>
        <div class="label" style="margin-top:14px;">What you are approving</div>
        <div class="title" id="item">Approval item</div>
        <ul id="details"></ul>
        <div id="docWrap" class="hidden" style="margin-top:16px;">
          <a id="docLink" href="#" target="_blank" rel="noopener" style="display:block; text-align:center; padding:14px 16px; border:2px solid #111111; border-radius:12px; color:#111111; font-weight:800; font-size:16px; text-decoration:none;">📄 View the document</a>
        </div>
      </div>
      <button id="approveBtn">I have read this and approve this</button>
      <p class="fineprint">One tap is all it takes. Austin gets notified the moment you approve.</p>
      <div class="flamebar"></div>
    </div>
    <div id="done" class="done hidden">
      <div class="check">✅</div>
      <h2>Approved. Thank you!</h2>
      <p id="doneText">Austin has been notified.</p>
    </div>
  </div>
<script>
  var HOOK = "https://hooks.zapier.com/hooks/catch/24884110/452anmp/";
  var q = new URLSearchParams(window.location.search);
  var client = q.get("client") || "";
  var business = q.get("business") || "Your business";
  var item = q.get("item") || "Approval item";
  var details = q.get("details") || "";
  if (client) document.getElementById("headline").textContent = "Hi " + client + ",";
  document.getElementById("business").textContent = business;
  document.getElementById("item").textContent = item;
  if (details) {
    var ul = document.getElementById("details");
    details.split("|").forEach(function (d) {
      var li = document.createElement("li");
      li.textContent = d;
      ul.appendChild(li);
    });
  }
  var doc = q.get("doc") || "";
  if (doc) {
    document.getElementById("docLink").href = doc;
    document.getElementById("docWrap").classList.remove("hidden");
  }
  var btn = document.getElementById("approveBtn");
  btn.addEventListener("click", function () {
    btn.disabled = true;
    btn.textContent = "Sending...";
    var payload = {
      client_name: client,
      business: business,
      item: item,
      approved_at: new Date().toISOString()
    };
    fetch(HOOK, {
      method: "POST",
      mode: "no-cors",
      body: new URLSearchParams(payload)
    }).then(function () {
      document.getElementById("main").classList.add("hidden");
      var done = document.getElementById("done");
      done.classList.remove("hidden");
      if (client) document.getElementById("doneText").textContent = "Thanks, " + client + ". Austin has been notified.";
    }).catch(function () {
      btn.disabled = false;
      btn.textContent = "I have read this and approve this";
      alert("That did not go through. Please try once more.");
    });
  });
</script>
</body>
</html>
